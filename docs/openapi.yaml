openapi: 3.0.3
info:
  title: Raízes do Nordeste API
  description: |
    API RESTful Back-End para a Rede Raízes do Nordeste (Projeto Multidisciplinar UNINTER - Trilha Back-End).
    Autora: Giselle Nunes (RU: 4753682)
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor Local de Desenvolvimento
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErroPadrao:
      type: object
      properties:
        error:
          type: string
          example: ERRO_DE_VALIDACAO
        message:
          type: string
          example: Mensagem legível explicando o erro
        details:
          type: array
          items: {}
        timestamp:
          type: string
          format: date-time
          example: "2026-11-18T15:00:00Z"
        path:
          type: string
          example: /pedidos
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar usuário e obter token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  example: admin@raizesdonordeste.com.br
                senha:
                  type: string
                  example: Admin@123
      responses:
        '200':
          description: Login realizado com sucesso
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadrao'
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuários (sem expor senha_hash ou CPF completo)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuários
        '401':
          description: Não autorizado
  /unidades:
    get:
      tags: [Unidades]
      summary: Listar unidades da rede
      responses:
        '200':
          description: Lista de unidades
  /produtos:
    get:
      tags: [Produtos]
      summary: Listar produtos nordestinos
      responses:
        '200':
          description: Lista de produtos
  /estoque:
    get:
      tags: [Estoque]
      summary: Consultar estoque por unidade
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estoque disponível por unidade
  /pedidos:
    get:
      tags: [Pedidos]
      summary: Listar pedidos com filtro por canalPedido, status e paginação
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: canalPedido
          schema:
            type: string
            enum: [APP, TOTEM, BALCAO, PICKUP, WEB]
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista paginada de pedidos
        '401':
          description: Não autorizado
    post:
      tags: [Pedidos]
      summary: Criar pedido multicanal com validação de estoque
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canalPedido, unidadeId, itens]
              properties:
                canalPedido:
                  type: string
                  enum: [APP, TOTEM, BALCAO, PICKUP, WEB]
                  example: APP
                unidadeId:
                  type: integer
                  example: 1
                itens:
                  type: array
                  items:
                    type: object
                    properties:
                      produtoId:
                        type: integer
                        example: 1
                      quantidade:
                        type: integer
                        example: 2
      responses:
        '201':
          description: Pedido criado com sucesso
        '404':
          description: Unidade ou produto não encontrado
        '409':
          description: Estoque insuficiente na unidade
        '422':
          description: Canal de pedido inválido ou campos obrigatórios ausentes
  /pagamentos/mock:
    post:
      tags: [Pagamentos]
      summary: Simular pagamento (aprovado ou recusado) e creditar pontos de fidelidade
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pedidoId]
              properties:
                pedidoId:
                  type: integer
                  example: 1
                metodo:
                  type: string
                  example: PIX
                simularRecusa:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Resultado do pagamento simulado
        '404':
          description: Pedido não encontrado
        '422':
          description: Dados inválidos
  /fidelidade:
    get:
      tags: [Fidelidade]
      summary: Consultar saldo de pontos de fidelidade
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saldo de pontos

